services:
  postgres:
    image: postgres:17-alpine
    container_name: habitly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: habitly
      POSTGRES_PASSWORD: habitly
      POSTGRES_DB: habitly
    ports:
      - "5432:5432"
    volumes:
      - habitly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitly -d habitly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  habitly-postgres-data:
